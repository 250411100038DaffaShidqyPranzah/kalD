<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Sample Book</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f8f9fa;
        }

        .hero{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .book-card{
            max-width:700px;
            text-align:center;
            border:none;
            box-shadow:0 0 20px rgba(0,0,0,.1);
            border-radius:20px;
        }

        .logo{
            width:150px;
            height:150px;
            object-fit:cover;
            border-radius:50%;
            margin:auto;
        }
    </style>
</head>

<body>

<div class="container hero">

    <div class="card book-card p-5">

        <img src="MyPP.jpeg" alt="Logo" class="logo mb-4">

        <h1 class="display-5 fw-bold">
            My Sample Book
        </h1>

        <p class="lead text-muted">
            Author: The Jupyter Book Community
        </p>

        <hr>

        <p>
            Dokumentasi ini dibuat menggunakan Jupyter Book.
            Notebook akan dieksekusi ulang setiap proses build dan
            terhubung dengan repository GitHub.
        </p>

        <div class="d-grid gap-2 d-md-flex justify-content-md-center">

            <a href="materi.html"
               class="btn btn-primary btn-lg">
                📖 Buka Notebooks
            </a>

            <a href="https://github.com/executablebooks/jupyter-book"
               target="_blank"
               class="btn btn-outline-dark btn-lg">
                GitHub Repository
            </a>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
